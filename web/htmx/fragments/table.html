{{define "table.html"}}
<div class="overflow-x-auto min-h-[300px]">
    <table class="w-full text-left border-collapse table-fixed">
        <thead>
            <tr class="border-b bg-gray-50 text-gray-600 text-xs uppercase font-semibold">
                <th class="p-2 w-1/4">ID</th>
                <th class="p-2 w-1/4">Task</th>
                <th class="p-2 w-1/6">Status</th>
                <th class="p-2 w-1/12 text-center">Attempts</th>
                <th class="p-2 w-1/4 text-center">Action</th>
            </tr>
        </thead>
        <tbody id="jobs-tbody">
            {{range .}}
            <tr class="border-b hover:bg-gray-50 h-12">
                <td class="p-2 font-mono text-xs truncate">{{.ID}}</td>
                <td class="p-2 font-medium truncate">{{.Task}}</td>
                <td class="p-2">
                    <span class="inline-block px-2 py-1 rounded text-xs font-bold text-center w-24
                        {{if eq .Status "PENDING"}}bg-yellow-200 text-yellow-800
                        {{else if eq .Status "RUNNING"}}bg-blue-200 text-blue-800
                        {{else if eq .Status "COMPLETED"}}bg-green-200 text-green-800
                        {{else if eq .Status "FAILED"}}bg-orange-100 text-orange-800 
                        {{else}}bg-red-200 text-red-800{{end}}">
                        {{.Status}}
                    </span>
                </td>
                <td class="p-2 text-center font-mono">{{.Attempts}}</td>
                <td class="p-2">
                    <div class="flex items-center justify-center gap-1 min-h-[32px]">
                        <button hx-get="/jobqueue/dashboard/jobs/{{.ID}}" 
                                hx-target="#job-detail" 
                                class="bg-gray-800 text-white px-2 py-1 text-xs rounded hover:bg-gray-700">
                            View
                        </button>

                        {{if eq .Status "DEAD"}}
                        <button hx-post="/jobqueue/dashboard/jobs/retry/{{.ID}}" 
                                hx-target="#jobs-table" 
                                class="bg-orange-600 text-white px-2 py-1 text-xs rounded hover:bg-orange-700">
                            Retry
                        </button>
                        {{end}}
                    </div>
                </td>
            </tr>
            {{else}}
            <tr>
                <td colspan="5" class="p-8 text-center text-gray-500">Belum ada job terdaftar</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
