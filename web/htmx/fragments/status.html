{{define "status.html"}}
<div class="grid grid-cols-5 gap-4 text-center">
    <div class="bg-yellow-100 text-yellow-800 p-4 rounded border border-yellow-300">
        <div class="text-2xl font-bold">{{.Pending}}</div>
        <div>Pending</div>
    </div>
    <div class="bg-blue-100 text-blue-800 p-4 rounded border border-blue-300">
        <div class="text-2xl font-bold">{{.Running}}</div>
        <div>Running</div>
    </div>
    <div class="bg-green-100 text-green-800 p-4 rounded border border-green-300">
        <div class="text-2xl font-bold">{{.Completed}}</div>
        <div>Completed</div>
    </div>
    <div class="bg-orange-100 text-orange-800 p-4 rounded border border-orange-300 shadow-sm">
        <div class="text-2xl font-bold">{{.Failed}}</div>
        <div class="text-xs uppercase font-semibold mt-1">Failed</div>
    </div>
    <div class="bg-red-100 text-red-800 p-4 rounded border border-red-300 shadow-sm">
        <div class="text-2xl font-bold">{{.Dead}}</div>
        <div class="text-xs uppercase font-semibold mt-1">Dead</div>
    </div>
</div>
{{end}}
