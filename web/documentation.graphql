mutation SimultaneousCreateJob($Job1: String!, $Job2: String!, $Job3: String!) {
  job1: Enqueue(task:$Job1) {
    id
  }
  job2: Enqueue(task:$Job2) {
    id
  }
  job3: Enqueue(task:$Job3) {
    id
  }
}

mutation SimulateUnstableJob {
  Enqueue(task: "unstable-job") {
    id
    attempts
    status
  }
}

mutation RetryDeadJob($id: String!) {
  RetryDeadJob(id: $id) {
    id
    task
    status
    attempts
  }
}

query GetAllJobs {
  Jobs {
    id
    task
  }
}

query GetJobById($id: String!) {
  Job(id: $id) {
    id
    task
    status
    attempts
  }
}

query GetJobsByStatus($status: String!) {
  JobsByStatus(status: $status) {
    id
    task
    status
    attempts
  }
}

query GetAllJobStatus{
   JobStatus{
    pending
    running
    failed
    completed
    dead
  }
}